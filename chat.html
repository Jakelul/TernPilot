<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TernPilot</title>
<style>body{margin:0;background:#17191e;color:#eee;font:16px system-ui;display:flex;height:100vh}aside{width:260px;padding:24px;background:#22252c;overflow:auto}main{flex:1;display:flex;flex-direction:column;padding:24px;min-width:0}button,select,textarea{background:#303540;color:#fff;border:1px solid #596071;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}aside button{display:block;width:100%;margin:10px 0;text-align:left}#messages{flex:1;overflow:auto;white-space:pre-wrap;line-height:1.6}.turn{padding:18px;margin:12px 0;background:#22252c;border-radius:12px}textarea{width:95%;height:80px}#status{color:#a8c5ff;padding:10px}small{color:#bbc} @media(max-width:650px){aside{width:150px;padding:10px}main{padding:10px}}.section{font-size:14px;color:#b9c4d9;margin-top:26px}.usage-card{padding:9px 0;border-bottom:1px solid #404651;font-size:13px}.usage-card strong{display:block;color:#a8c5ff;margin-bottom:4px}.usage-card small{font-size:11px}button[aria-current="true"]{border-color:#a8c5ff;background:#39465d}#folders button{font-weight:600}#list button{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}progress{width:100%;height:9px;accent-color:#97b7f5;margin:8px 0}#usage-history{max-height:220px;overflow:auto}#usage-history button{font-size:12px}dialog{background:#22252c;color:#eee;border:1px solid #596071;border-radius:14px;max-width:650px;width:80vw}dialog::backdrop{background:#0009}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.65 system-ui;max-height:65vh;overflow:auto}.gauge-heading{display:flex;justify-content:space-between;gap:8px;align-items:center}.gauge-heading strong{margin:0}.gauge-heading span{color:#aab2c2;font-size:12px}.quota-unknown{height:7px;border-radius:5px;background:#444b58;margin:10px 0}#usage-disclosure summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;list-style:none}#usage-disclosure summary::-webkit-details-marker{display:none}#usage-disclosure[open] .chevron{transform:rotate(90deg)}.chevron{font-size:12px}#usage-disclosure summary:focus-visible{outline:2px solid #a8c5ff;outline-offset:4px}</style>
<aside><section aria-label="모델별 토큰 사용량"><div id="usage"></div></section><details id="usage-disclosure"><summary class="section">사용 기록 <span class="chevron" aria-hidden="true">▶</span></summary><div id="usage-history"></div></details><h1>TernPilot</h1><h2 class="section">프로젝트 폴더</h2><select id="project" aria-label="프로젝트" hidden></select><div id="folders"></div><h2 class="section">대화 목록</h2><button id="new">＋ 새 대화</button><div id="list"></div></aside>
<main><h2>모델을 연결하는 작업 공간</h2><small>요청은 선택된 제공자에게 전달됩니다. 코드 수정이 가능한 작업 실행입니다. 각 서비스 사용량이 별도로 소비됩니다.</small><div id="messages"></div><div id="status" role="status"></div><form id="form"><label>담당 <select id="engine"><option value="auto">자동 · Astra 분류</option><option value="codex">Astra</option><option value="claude">Opus</option><option value="gemini">Argon · 읽기 전용</option></select></label><p><textarea id="request" aria-label="작업 요청" required placeholder="작업을 요청하세요"></textarea></p><button id="send">실행 및 기록</button></form></main>
<dialog id="usage-detail"><button id="close-detail">닫기</button><h2>작업별 사용 내역</h2><pre id="detail-text"></pre></dialog><script>
const token=location.hash.slice(1)||sessionStorage.getItem('ternpilot-token');if(token)sessionStorage.setItem('ternpilot-token',token);history.replaceState(null,'',location.pathname);let selected=null,state={chats:[]};const $=id=>document.getElementById(id);
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-TernPilot-Token':token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const x=await r.json();if(!r.ok)throw Error(x.error);return x}
function render(){
$('usage').replaceChildren();for(const [engine,label] of [['codex','Codex · Astra'],['claude','Claude Code · Opus'],['gemini','Argon']]){const el=document.createElement('div');el.className='usage-card';const heading=document.createElement('div');heading.className='gauge-heading';const title=document.createElement('strong');const last=(state.usage_records||[]).find(r=>r.engine===engine&&r.status!=='running');title.textContent=label+(last?.status==='completed'?' ✓':'');title.title=last?`최근 작업 ${last.status} · ${new Date(last.time*1000).toLocaleString()}`:'실제 응답 확인 기록 없음';const q=state.quotas?.[engine];const known=typeof q?.remaining==='number'&&Number.isFinite(q.remaining);const percent=document.createElement('span');percent.textContent=known?`${q.remaining}%`:'주간 미확인';const info=`${last?.status==='completed'?'모델 응답 확인됨 · ':''}${q?.window||'주간'}${q?.source?' · '+q.source:''}${q?.observed_at?' · CLI 관측 '+new Date(q.observed_at*1000).toLocaleString():''} · ${q?.status||'확인 중'}${q?.checked_at?' · 조회 '+new Date(q.checked_at*1000).toLocaleString():''}${q?.resets_at?' · 갱신 '+new Date(typeof q.resets_at==='number'?q.resets_at*1000:q.resets_at).toLocaleString():''}`;percent.title=info;heading.append(title,percent);el.append(heading);const gauge=document.createElement(known?'progress':'div');if(known){gauge.max=100;gauge.value=q.remaining}else{gauge.className='quota-unknown';gauge.setAttribute('role','img')}gauge.setAttribute('aria-label',label+(known?` 주간 잔여 ${q.remaining}%`:' 주간 잔여 미확인'));gauge.title=info;el.append(gauge);if(engine==='gemini'){const detail=document.createElement('small');detail.textContent=known?`${q.window} · 60초 갱신`:q?.status||'조회 중';el.append(detail)}$('usage').append(el)}
$('usage-history').replaceChildren();for(const row of state.usage_records||[]){const b=document.createElement('button');const amount=row.reports.reduce((n,r)=>n+r.input+r.output,0);const title=row.task?row.task.split('Current request:\n').pop():'과거 작업 · 요청 기록 없음';b.textContent=`${title.slice(0,45)} · ${row.reports.length?amount.toLocaleString()+' 토큰':'사용량 미보고'}`;b.onclick=()=>{const lines=[`프로젝트: ${row.project}`,`실행: ${row.run_id}`,`상태: ${row.status}`,`시각: ${new Date(row.time*1000).toLocaleString()}`,'','요청',row.task||'이전 버전에서 요청을 보존하지 않은 실행입니다.','','사용 내역 (제공자 보고값)'];for(const r of row.reports)lines.push(`${r.engine} · ${r.phase}: 입력 ${r.input.toLocaleString()} / 출력 ${r.output.toLocaleString()} / 캐시 읽기 ${r.cache_read??'미보고'} / 쓰기 ${r.cache_write??'미보고'}`);lines.push('','크레딧·구독 잔여량: 미확인. 토큰 합계에는 캐시를 별도로 더하지 않습니다.');$('detail-text').textContent=lines.join('\n');$('usage-detail').showModal()};$('usage-history').append(b)}
$('folders').replaceChildren();for(const p of state.projects||[]){const b=document.createElement('button');b.textContent='📁 '+p;b.setAttribute('aria-current',String(p===$('project').value));b.onclick=()=>{$('project').value=p;selected=null;render()};$('folders').append(b)}
const chat=state.chats.find(c=>c.id===selected);$('messages').replaceChildren();for(const t of chat?.turns||[]){const el=document.createElement('div');el.className='turn';el.textContent=`나\n${t.request}\n\n${t.engine} · ${t.status}\n${t.answer||'작업 진행 중…'}${t.save_error?'\n저장 실패: '+t.save_error:''}`;$('messages').append(el)}$('list').replaceChildren();for(const c of state.chats.filter(c=>c.project===$('project').value)){const b=document.createElement('button');b.textContent=c.title;b.setAttribute('aria-current',String(c.id===selected));b.onclick=()=>{selected=c.id;render()};$('list').append(b)}$('send').disabled=state.busy;$('status').textContent=state.busy?'작업 중 · 이 창을 닫아도 서버가 실행 중이면 계속됩니다.':'준비됨 · 대화는 설정된 Obsidian 볼트에 저장됩니다.'}
async function refresh(){try{const fresh=await api('/api/state');if(JSON.stringify(fresh)===JSON.stringify(state))return;state=fresh;if(!$('project').options.length)for(const p of state.projects){const o=document.createElement('option');o.value=o.textContent=p;$('project').append(o)}render()}catch(e){$('status').textContent=e.message}}
$('close-detail').onclick=()=>$('usage-detail').close();$('new').onclick=()=>{selected=null;render()};$('project').onchange=()=>{selected=null;render()};$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;try{const c=await api('/api/send',{id:selected,project:$('project').value,engine:$('engine').value,request:$('request').value});selected=c.id;$('request').value='';await refresh()}catch(e){$('status').textContent=e.message;$('send').disabled=false}};refresh();setInterval(refresh,2000);
</script></html>
