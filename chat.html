<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TernPilot</title><link rel="stylesheet" href="/chat.css"><script defer src="/marked.js"></script><script defer src="/purify.js"></script><script defer src="/chat.js"></script></head>
<body>
<aside id="sidebar">
  <div class="brand"><span class="brand-mark">T</span><strong>TernPilot</strong><span class="local-badge">LOCAL</span></div>
  <button id="new" class="new-chat"><span>＋</span> 새 대화 <kbd>⌘ N</kbd></button>
  <label class="search"><span>⌕</span><input id="search" type="search" placeholder="대화 검색" aria-label="대화 검색"></label>
  <label class="section-label" for="project">프로젝트</label><select id="project"></select>
  <div class="section-label">최근 대화</div><nav id="list" aria-label="대화 목록"></nav>
  <div class="sidebar-bottom"><div class="section-label">연결된 모델 <span>주간 잔여량</span></div><section id="usage" aria-label="모델별 사용량"></section><button id="accounts-open" class="quiet">⚙ <span>계정 및 연결</span><span class="arrow">↗</span></button><button id="history-open" class="quiet">◷ <span>사용 기록</span></button></div>
</aside>
<main>
  <header><button id="toggle-sidebar" class="icon-button" aria-label="사이드바 열기/닫기" aria-expanded="true">☰</button><div class="header-text"><strong id="chat-title">새로운 대화</strong><span id="project-name"></span></div><span class="header-tag">당신의 AI, 한곳에서</span></header>
  <div id="scroll-area"><div id="messages" aria-label="대화 내용"></div></div>
  <footer><form id="form"><label class="sr-only" for="request">메시지</label><textarea id="request" maxlength="20000" rows="2" required placeholder="무엇을 함께 생각해 볼까요?"></textarea><div class="composer-bottom"><label class="engine-label"><span class="sr-only">답변 모델</span><select id="engine"><option value="auto">✦ 자동 선택</option><option value="codex">Codex · Astra</option><option value="claude">Claude Code · Opus</option><option value="gemini">Gemini4 Argon</option></select></label><span id="engine-hint">요청에 맞는 모델을 선택합니다</span><button id="send" type="submit" aria-label="메시지 보내기">↑</button></div></form><div class="footer-note"><span id="status" role="status">연결 중…</span><span>Enter 전송 · Shift + Enter 줄바꿈</span></div><div class="work-note">프로젝트 작업 모드 · 요청에 따라 파일을 읽거나 수정할 수 있습니다.</div></footer>
</main>
<dialog id="accounts"><div class="dialog-heading"><div><span class="eyebrow">CONNECTIONS</span><h2>내 AI 계정</h2></div><button class="icon-button" data-close="accounts" aria-label="계정 창 닫기">×</button></div><p class="muted">이 Mac의 기존 계정을 사용합니다. 로그인은 각 서비스의 공식 도구에서 진행되며, TernPilot은 비밀번호를 저장하지 않습니다.</p><div id="account-list"></div><p id="account-status" role="status" class="muted"></p><button id="accounts-refresh" class="quiet">↻ 연결 상태 다시 확인</button></dialog>
<dialog id="history"><div class="dialog-heading"><h2>사용 기록</h2><button class="icon-button" data-close="history" aria-label="사용 기록 닫기">×</button></div><p class="muted">각 제공자가 보고한 작업별 사용량입니다.</p><div id="usage-history"></div></dialog>
<dialog id="usage-detail"><div class="dialog-heading"><h2>작업별 사용 내역</h2><button class="icon-button" data-close="usage-detail" aria-label="작업 내역 닫기">×</button></div><pre id="detail-text"></pre></dialog>
</body></html>
